
services:
  user_db:
    image: postgres:18.6
    restart: unless-stopped
    env_file:
      - ./src/UserService/.env
    volumes:
      - user_data:/var/lib/postgresql
      - ./src/UserService/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 10

  user_service:
    build:
      context: ./src
      dockerfile: UserService/Dockerfile
    env_file:
      - ./src/UserService/.env
    depends_on:
      user_db:
        condition: service_healthy
    image: lorebase-user_service

volumes:
  user_data:
